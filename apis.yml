name: Nimsoft
description: 'Nimsoft was a SaaS-based IT infrastructure and application monitoring and
  service-desk company, founded in 1998 as Nimbus Software in Oslo, Norway and later
  headquartered in Redwood City, California. Backed by Northzone and JMI Equity, it was
  acquired by CA Technologies in March 2010 for roughly $350 million, after which its
  products were folded into CA Unified Infrastructure Management (UIM). CA was in turn
  acquired by Broadcom in 2018, and the former Nimsoft monitoring capability now lives
  on as Broadcom DX Unified Infrastructure Management. The www.nimsoft.com domain today
  resolves to Broadcom infrastructure, and Nimsoft has no independent developer portal,
  public API, or OpenAPI surface of its own.'
